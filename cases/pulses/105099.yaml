# Pulse file for 105099 -- see cases/pulses/TEMPLATE.yaml for every key.
# Regenerate source.env with: bin/pds-configure cases/pulses/105099.yaml
shot: 105099
description: "DINA shot 105099; source: DINA project database /work/projects/dina/imasdb (MDSplus), not the official ITER store"

# Preparation only. 105099 already has HAND-WRITTEN overrides in cases/overrides/, kept as
# they are (generating them from this file would change the cases):
#   inverse_convergence_105099*        calibrated TORAX
#   metis_nice_inverse_from_dina_105099.ymmsl
# This file drives the data preparation and the plot times only.
workflows: []

prepare:
  source: imas:mdsplus?path=/work/projects/dina/imasdb/iter/3/105099/2
  # The stored data (pds-scenarios) were prepared with the "legacy" set (ITER_MD
  # 111001/203, 115005/2, 116000/4); "basic" = the active ITER_MD versions.
  machine_description: basic
  n_timeslices: 41
  md_layout: separate
  dd_version: "4.0.0"

time:
  # t_start = loop.t_min of the hand-written inverse_convergence override; that override
  # leaves loop.t_max unset (all slices), so t_end = last stored slice 76.554 s rounded
  # outward to 0.1 s.
  # Applies only to overrides generated from this file (none today).
  t_start: 5.0
  t_end: 76.6

# TORAX calibration found in the hand-written
# cases/overrides/inverse_convergence_105099_config_torax.py (the only differences from
# workflows/inverse_convergence/config_torax.py). Recorded here, NOT active, so it is not
# lost if the overrides are ever generated from this file:
# transport_calibration:
#   model: bohm-gyrobohm
#   chi_multiplier: {0: 1.8, 40: 1.8, 60: 4.0, 80: 4.0}   # all four BgB multipliers

postprocess:
  t_list: [20, 35, 60]
